<section id="inscriptions">
<h2>INSCRIPTIONS ET ADMISSIONS</h2>

<p>
Bienvenue au Complexe Scolaire Saint Joseph Kasumbalesa.
Les inscriptions sont ouvertes aux nouveaux élèves.
</p>

<h3>Formulaire de demande d'inscription</h3>

<form action="mailto:cesairekitumaini@gmail.com"
method="post" enctype="text/plain">

<label>Nom de l'élève :</label><br>
<input type="text" name="Nom" required><br><br>

<label>Postnom :</label><br>
<input type="text" name="Postnom"><br><br>

<label>Prénom :</label><br>
<input type="text" name="Prenom" required><br><br>

<label>Sexe :</label><br>
<select name="Sexe">
<option>Masculin</option>
<option>Féminin</option>
</select><br><br>

<label>Date de naissance :</label><br>
<input type="date" name="Naissance"><br><br>

<label>Classe demandée :</label><br>
<select name="Classe">
<option>Maternelle</option>
<option>1re primaire</option>
<option>2e primaire</option>
<option>3e primaire</option>
<option>4e primaire</option>
<option>5e primaire</option>
<option>6e primaire</option>
<option>7e éducation de base</option>
<option>8e éducation de base</option>
<option>1re humanités</option>
<option>2e humanités</option>
<option>3e humanités</option>
<option>4e humanités</option>
</select><br><br>

<label>Option (si applicable) :</label><br>
<select name="Option">
<option>Sans option</option>
<option>Humanités pédagogiques</option>
<option>Biologie-chimie</option>
<option>Commerciale et gestion</option>
<option>Mécanique générale</option>
<option>Électricité</option>
<option>Construction</option>
<option>Technique coupe et couture</option>
</select><br><br>

<label>Nom du parent ou tuteur :</label><br>
<input type="text" name="Parent" required><br><br>

<label>Téléphone du parent :</label><br>
<input type="tel" name="Telephone" required><br><br>

<label>Adresse :</label><br>
<input type="text" name="Adresse"><br><br>

<button type="submit">Envoyer la demande</button>

</form>
</section>
